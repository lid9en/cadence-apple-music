name: Build and release

# Source lives on main. Pushing a version tag builds Cadence.exe and
# attaches it to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0). Leave blank to build only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity-check the package imports
        run: python -c "import cadence, cadence.app, cadence.media, cadence.applemusic_fix; print(cadence.__version__)"

      - name: Build Cadence.exe
        run: pyinstaller --noconfirm --clean cadence.spec

      - name: Verify the binary exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Cadence.exe)) { throw "dist/Cadence.exe was not produced" }
          $size = (Get-Item dist/Cadence.exe).Length / 1MB
          Write-Host ("Cadence.exe is {0:N1} MB" -f $size)

      - name: Package the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/Cadence.exe package/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath Cadence-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-windows-x64
          path: |
            dist/Cadence.exe
            Cadence-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cadence.exe
            Cadence-windows-x64.zip
          generate_release_notes: true
          body: |
            **Cadence** — an Apple Music companion for Windows.

            Download `Cadence.exe` and run it. No installer, no Python needed.
            Windows 10/11 with the WebView2 runtime (already present on
            Windows 11) and the Apple Music app from the Microsoft Store.

            Windows SmartScreen will warn about an unsigned binary the first
            time — choose **More info → Run anyway**, or build from source.
