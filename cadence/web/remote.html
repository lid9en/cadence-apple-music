<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cadence Remote</title>
<style>
:root {
  --bg: #0d0d12; --bg2: #16161e; --fg: #f2f2f5; --muted: #93939f;
  --accent: #fa2d48; --accent-fg: #fff;
  --ease: cubic-bezier(.22,.61,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
/* The icons are <svg> inside a grid button; the UA [hidden] rule loses to
   the layout, so state it explicitly or play and pause both render. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  overflow: hidden;
  transition: background 700ms var(--ease);
}
#wrap {
  position: relative; z-index: 1;
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 5vh;
  padding: max(4vh, env(safe-area-inset-top)) 24px
           max(4vh, calc(env(safe-area-inset-bottom) + 12px));
}
#bg {
  position: fixed; inset: -20%;
  background-size: cover; background-position: center;
  filter: blur(60px) saturate(1.6); opacity: .45;
  z-index: 0; transition: opacity .8s;
}
#scrim {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.35), var(--bg) 88%);
}

#badge {
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  font-weight: 700; color: var(--muted);
  border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
  padding: 6px 14px; border-radius: 999px; flex: 0 0 auto;
}
body.playing #badge { color: var(--accent); border-color: transparent;
  background: color-mix(in srgb, var(--accent) 18%, transparent); }

#art {
  width: min(74vw, 46vh); aspect-ratio: 1;
  border-radius: 18px; object-fit: cover;
  background: rgba(255,255,255,.06);
  box-shadow: 0 26px 60px rgba(0,0,0,.6);
  flex: 0 0 auto;
  transition: transform .5s var(--ease);
}
body:not(.playing) #art { transform: scale(.94); }

#info { text-align: center; width: 100%; flex: 0 0 auto; }
#title { font-size: 22px; font-weight: 700; letter-spacing: -.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#artist { font-size: 16px; color: var(--muted); margin-top: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#bar { width: 100%; flex: 0 0 auto; }
#track { height: 6px; border-radius: 99px; background: rgba(255,255,255,.16);
  position: relative; touch-action: none; }
#fill { height: 100%; width: 0; border-radius: 99px; background: var(--accent);
  transition: width .25s linear; }
#knob { position: absolute; top: 50%; left: 0; width: 20px; height: 20px;
  margin: -10px 0 0 -10px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent);
  transition: left .25s linear; }
#track.drag #fill, #track.drag #knob { transition: none; }
#times { display: flex; justify-content: space-between; margin-top: 10px;
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

#ctl { display: flex; align-items: center; justify-content: center;
  gap: 8vw; flex: 0 0 auto; }
button.b { border: 0; background: transparent; color: var(--fg);
  width: 64px; height: 64px; display: grid; place-items: center;
  border-radius: 50%; cursor: pointer; }
button.b:active { transform: scale(.88); }
button.b svg { width: 34px; height: 34px; fill: currentColor; }
button.b:disabled { opacity: .3; }
#play { width: 84px; height: 84px; background: var(--accent);
  color: var(--accent-fg); box-shadow: 0 10px 30px -8px var(--accent); }
#play svg { width: 38px; height: 38px; }

#offline { position: fixed; inset: 0; z-index: 5; display: none;
  place-items: center; text-align: center; padding: 40px;
  background: var(--bg); color: var(--muted); }
body.offline #offline { display: grid; }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px);
  transform: translate(-50%, 20px); background: var(--fg); color: var(--bg);
  padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: .25s var(--ease); z-index: 6; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="bg"></div><div id="scrim"></div>

<div id="wrap">
  <div id="badge">—</div>
  <img id="art" alt="">
  <div id="info">
    <div id="title">Nothing playing</div>
    <div id="artist"></div>
  </div>
  <div id="bar">
    <div id="track"><div id="fill"></div><div id="knob"></div></div>
    <div id="times"><span id="t0">0:00</span><span id="t1">0:00</span></div>
  </div>
  <div id="ctl">
    <button class="b" id="prev" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14l-11-7z"/></svg>
    </button>
    <button class="b" id="play" aria-label="Play or pause">
      <svg id="ip" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg id="ia" viewBox="0 0 24 24" hidden><rect x="6.5" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.3" y="4.5" width="4.2" height="15" rx="1.4"/></svg>
    </button>
    <button class="b" id="next" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5v14l11-7z"/></svg>
    </button>
  </div>
</div>

<div id="offline"><div><b>Lost the connection to your PC</b><br>
  Cadence may have closed, or you left the network.</div></div>
<div id="toast"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (s) => document.querySelector(s);
let dur = 0, dragging = false, dragVal = 0, artToken = "", fails = 0;

const fmt = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};

let tt = null;
function toast(m) {
  const t = $("#toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200);
}

async function api(path, opts) {
  const sep = path.includes("?") ? "&" : "?";
  return fetch(path + sep + "t=" + encodeURIComponent(TOKEN), opts);
}

async function send(action, value) {
  try {
    await api("/api/control", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, value }),
    });
    setTimeout(tick, 120);
  } catch (e) { toast("Could not reach the PC"); }
}

function paint(s) {
  document.body.classList.toggle("playing", !!s.playing);
  $("#badge").textContent = s.connected ? (s.source_label || "Playing") : "Nothing playing";
  $("#title").textContent = s.title || "Nothing playing";
  $("#artist").textContent = s.artist || "";

  const p = s.palette || {};
  if (p.bg) {
    const r = document.documentElement.style;
    r.setProperty("--bg", p.bg);
    r.setProperty("--fg", p.fg || "#f2f2f5");
    r.setProperty("--muted", p.muted || "#93939f");
    r.setProperty("--accent", p.accent || "#fa2d48");
    r.setProperty("--accent-fg", p.accent_fg || "#fff");
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", p.bg);
  }

  dur = Number(s.duration) || 0;
  const pos = dragging ? dragVal : (Number(s.position) || 0);
  const pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;
  $("#fill").style.width = pct + "%";
  $("#knob").style.left = pct + "%";
  $("#t0").textContent = fmt(pos);
  $("#t1").textContent = fmt(dur);

  $("#ip").toggleAttribute("hidden", !!s.playing);
  $("#ia").toggleAttribute("hidden", !s.playing);
  $("#prev").disabled = s.connected && !s.can_prev;
  $("#next").disabled = s.connected && !s.can_next;

  if (s.art_token && s.art_token !== artToken) {
    artToken = s.art_token;
    const url = "/api/art?t=" + encodeURIComponent(TOKEN) + "&v=" +
      encodeURIComponent(s.art_token);
    $("#art").src = url;
    $("#bg").style.backgroundImage = `url("${url}")`;
  } else if (!s.art_token) {
    artToken = "";
    $("#art").removeAttribute("src");
    $("#bg").style.backgroundImage = "";
  }
}

async function tick() {
  try {
    const r = await api("/api/state");
    if (r.status === 403) {
      document.body.classList.add("offline");
      $("#offline").innerHTML = "<div><b>This link is no longer valid</b><br>" +
        "Open Cadence on the PC and scan the code again.</div>";
      return;
    }
    paint(await r.json());
    fails = 0;
    document.body.classList.remove("offline");
  } catch (e) {
    if (++fails > 3) document.body.classList.add("offline");
  }
}

$("#play").onclick = () => send("play_pause");
$("#next").onclick = () => send("next");
$("#prev").onclick = () => send("previous");

const track = $("#track");
const posFrom = (ev) => {
  const r = track.getBoundingClientRect();
  const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
  return Math.max(0, Math.min(1, x / r.width)) * dur;
};
const startDrag = (ev) => {
  if (!dur) return;
  dragging = true; track.classList.add("drag");
  dragVal = posFrom(ev); paintDrag();
};
const moveDrag = (ev) => {
  if (!dragging) return;
  ev.preventDefault();
  dragVal = posFrom(ev); paintDrag();
};
const endDrag = () => {
  if (!dragging) return;
  dragging = false; track.classList.remove("drag");
  send("seek", dragVal);
};
function paintDrag() {
  const pct = dur > 0 ? (dragVal / dur) * 100 : 0;
  $("#fill").style.width = pct + "%";
  $("#knob").style.left = pct + "%";
  $("#t0").textContent = fmt(dragVal);
}
track.addEventListener("touchstart", startDrag, { passive: true });
track.addEventListener("touchmove", moveDrag, { passive: false });
track.addEventListener("touchend", endDrag);
track.addEventListener("mousedown", startDrag);
window.addEventListener("mousemove", moveDrag);
window.addEventListener("mouseup", endDrag);

tick();
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) tick();
});
</script>
</body>
</html>
